# ============================================================================
# ACE Pro Main Configuration — Voron 2.4 R2 350mm
# ============================================================================
# Basierend auf ducati1198's Generic Config, angepasst fuer Voron 2.4
# Original: https://github.com/ducati1198/acepro-any-klipper
# ============================================================================
# Einstiegspunkt: In printer.cfg einbinden mit [include acepro.cfg]
# ============================================================================

[include acepro_printer_macros.cfg]

[include acepro_setting.cfg]


[include spoolman_logic.cfg]

######################################################################
# Filament-Sensoren
######################################################################

# Briconaut am Toolhead-Eingang (SB2209 / EBBCan)
# WICHTIG: Alle ducati-Macros referenzieren diesen Namen!
[filament_switch_sensor filament_toolhead]
pause_on_runout: True
runout_gcode:
    {% set ps = printer.print_stats.state|string %}
    {% if ps in ["printing", "paused"] %}
        TO_THROW_POSITION
        RESPOND TYPE=command MSG="action:prompt_begin Filament Runout"
        RESPOND TYPE=command MSG="action:prompt_text Filament runout detected. Print is paused. Insert filament into the toolhead, it will be pulled in automatically."
        RESPOND TYPE=command MSG="action:prompt_button Cancel Print|RUNOUT_CANCEL_PRINT"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        { action_respond_info("ACE[m]: Runout ignored (state=%s)" % ps) }
    {% endif %}
insert_gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {% set ps = printer.print_stats.state|string %}
    {% if ps == "paused" %}
        M83
        G92 E0
        G1 E150 F300
        G92 E0
        NOZZLE_CLEAN
        RESPOND TYPE=command MSG="action:prompt_begin Filament Loaded"
        RESPOND TYPE=command MSG="action:prompt_text Filament detected. Choose next action:"
        RESPOND TYPE=command MSG="action:prompt_button Extrude 50mm|INSERT_EXTRUDE_50"
        RESPOND TYPE=command MSG="action:prompt_button Resume Print|INSERT_RESUME_PRINT"
        RESPOND TYPE=command MSG="action:prompt_button Cancel Print|INSERT_CANCEL_PRINT"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif ps not in ["printing", "paused"] %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament Detected"
        RESPOND TYPE=command MSG="action:prompt_text Filament detected while printer is idle. Load filament to nozzle?"
        RESPOND TYPE=command MSG="action:prompt_button Load Filament (@245°C)|INSERT_LOAD_FILAMENT"
        RESPOND TYPE=command MSG="action:prompt_button Dismiss|INSERT_DISMISS"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
event_delay: 3.0
pause_delay: 0.5
switch_pin: EBBCan:gpio21

# Toolhead-Sensor NACH den Extruder-Gears (SB2209 / EBBCan)
# Bestaetigt, dass Filament vom Extruder gegriffen und Richtung Nozzle
# geschoben wird. Rein informativer Sensor — keine Pause-Logik.
[filament_switch_sensor filament_nozzle]
pause_on_runout: False
switch_pin: EBBCan:gpio24
event_delay: 1.0
insert_gcode:
    { action_respond_info("Toolhead: Filament nach Extruder-Gears erkannt") }
runout_gcode:
    { action_respond_info("Toolhead: Filament nach Extruder-Gears weg") }

# Anycubic RDM am Rahmen (Manta M8P V2.0)
# PF0 = Switch (Filament da/weg), PC15 = Encoder (Bewegungserkennung)
# filament_tracker kombiniert beide Signale in einem Modul (aus Kobra-S1 Fork)
# und ermoeglicht Tangle Detection im ACE Python-Treiber.
[filament_tracker filament_runout_rdm]
tracker_detect_pin: ^PF0
tracker_encoder_pin: ^PC15
signal_type: gpio
detect_pin_is_switch: True
length_per_pulse: 1.0
safe_unwind_len: 150
absence_timeout: 2
extruder: extruder
detection_length: 15.0
pause_on_runout: True
debug_trace: True
runout_gcode:

[gcode_macro QUERY_RDM_TRACKER]
description: Show filament_tracker status including encoder pulses
gcode:
    {% set tracker = printer["filament_tracker filament_runout_rdm"] %}
    RESPOND MSG="RDM Tracker:"
    RESPOND MSG="  filament_present: {tracker.filament_present}"
    RESPOND MSG="  encoder_pulse: {tracker.encoder_pulse}"
    RESPOND MSG="  filament_distance: {tracker.filament_distance|round(1)}mm"
    RESPOND MSG="  encoder_signal: {tracker.encoder_signal_state}"
    RESPOND MSG="  enabled: {tracker.enabled}"

[gcode_macro UPDATE_ACE_ENCODER]
description: Enable/disable RDM sensor based on ACEPRO pin
gcode:
    {% set acepro = printer["output_pin ACE_Pro"].value|default(0)|int %}
    {% if acepro != 1 %}
        SET_FILAMENT_SENSOR SENSOR=filament_runout_rdm ENABLE=0
    {% endif %}

[delayed_gcode MONITOR_ACEPRO_ENCODER]
initial_duration: 2
gcode:
    UPDATE_ACE_ENCODER
    UPDATE_DELAYED_GCODE ID=MONITOR_ACEPRO_ENCODER DURATION=2

[gcode_macro SFS_DISABLE_RDM]
description: Force disable RDM sensor
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_runout_rdm ENABLE=0

[gcode_macro ENABLE_FILAMENT_NOZZLE]
description: Enable Filament Runout Nozzle Sensor
gcode:
    M117 ENABLING the Filament Runout Nozzle Sensor
    SET_FILAMENT_SENSOR SENSOR=filament_toolhead ENABLE=1

[gcode_macro DISABLE_FILAMENT_NOZZLE]
description: Disable Filament Runout Nozzle Sensor
gcode:
    M117 DISABLING the Filament Runout Nozzle Sensor
    SET_FILAMENT_SENSOR SENSOR=filament_toolhead ENABLE=0

######################################################################
# Movement Macros
######################################################################

[gcode_macro TO_THROW_POSITION]
description: Move to purge/poop position (left side, near cutter)
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 X{vars.poop_x} F12000
    G1 Y{vars.poop_y} F12000
    VEL_POP

######################################################################
# Cutter Macro
######################################################################

[gcode_macro CUT_TIP]
description: Cut or form filament tip — Filametrix cutter if installed, else software tip-forming
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}

    {% if vars.cut_enabled | lower == 'true' %}
        # ============================================================
        # MODUS A: Physischer Filametrix-Cutter
        # ============================================================
        RESPOND TYPE=echo MSG="CUT_TIP: Filametrix cutter"
        {% if "xy" not in printer.toolhead.homed_axes %}
            G28 Y X
        {% endif %}

        SAVE_GCODE_STATE NAME=cut_tip_state

        {% set y_min = printer.toolhead.axis_minimum.y|float %}
        {% set y_max = printer.toolhead.axis_maximum.y|float %}
        {% set x_min = printer.toolhead.axis_minimum.x|float %}
        {% set x_max = printer.toolhead.axis_maximum.x|float %}

        G90
        # Erst X sicher anfahren, dann Y — verhindert Kollision mit Depressor
        G1 X{ vars.cut_block_x } F8000
        G1 Y{ vars.cut_block_y } F8000

        {% set axis = vars.cut_axis | upper %}
        {% if axis == 'X' %}
            {% set start_pos = vars.cut_engage_x %}
            {% set end_pos = vars.cut_full_x %}
            {% set other_y = vars.cut_engage_y %}
            {% set start_pos = start_pos if start_pos >= x_min else x_min %}
            {% set start_pos = start_pos if start_pos <= x_max else x_max %}
            {% set end_pos = end_pos if end_pos >= x_min else x_min %}
            {% set end_pos = end_pos if end_pos <= x_max else x_max %}
        {% else %}
            {% set axis = 'Y' %}
            {% set start_pos = vars.cut_engage_y %}
            {% set end_pos = vars.cut_full_y %}
            {% set other_x = vars.cut_engage_x %}
            {% set start_pos = start_pos if start_pos >= y_min else y_min %}
            {% set start_pos = start_pos if start_pos <= y_max else y_max %}
            {% set end_pos = end_pos if end_pos >= y_min else y_min %}
            {% set end_pos = end_pos if end_pos <= y_max else y_max %}
        {% endif %}

        {% if axis == 'X' %}
            G1 X{ start_pos } Y{ other_y } F{ vars.cut_speed }
        {% else %}
            G1 X{ other_x } Y{ start_pos } F{ vars.cut_speed }
        {% endif %}
        M400

        {% for i in range(vars.cut_repetitions | int) %}
            {% if axis == 'X' %}
                G1 X{ end_pos } F{ vars.cut_speed }
            {% else %}
                G1 Y{ end_pos } F{ vars.cut_speed }
            {% endif %}
            M400
            {% if vars.cut_pause_ms | int > 0 %}
                G4 P{ vars.cut_pause_ms | int }
            {% endif %}
            {% if i < (vars.cut_repetitions | int) - 1 %}
                {% if axis == 'X' %}
                    G1 X{ start_pos } F{ vars.cut_speed }
                {% else %}
                    G1 Y{ start_pos } F{ vars.cut_speed }
                {% endif %}
                M400
            {% endif %}
        {% endfor %}

        # Erst Y weg vom Depressor, dann X — verhindert Kollision
        G1 Y{ vars.cut_block_y } F{ vars.cut_speed }
        G1 X{ vars.cut_block_x } F{ vars.cut_speed }
        TO_THROW_POSITION

        RESTORE_GCODE_STATE NAME=cut_tip_state MOVE=0 MOVE_SPEED=200
    {% else %}
        # ============================================================
        # MODUS B: Software Tip-Forming (kein Cutter)
        # Basiert auf Happy Hare / SuperSlicer Tip-Forming-Logik:
        #   1. Ramming — Filament in Nozzle pressen
        #   2. Nozzle Separation — schnell aus Schmelzzone ziehen
        #   3. Cooling Moves — hin/her in Kuehlzone, Spitze formen
        #   4. Final Retract — String abreissen
        # ============================================================
        RESPOND TYPE=echo MSG="CUT_TIP: Software tip-forming (kein Cutter)"

        {% set tube_pos    = vars.tip_cooling_tube_pos|float %}
        {% set tube_len    = vars.tip_cooling_tube_len|float %}
        {% set moves       = vars.tip_cooling_moves|int %}
        {% set cool_slow   = vars.tip_cooling_speed_start|float %}
        {% set cool_fast   = vars.tip_cooling_speed_final|float %}
        {% set unload_fast = vars.tip_unloading_speed_start|float %}
        {% set unload_slow = vars.tip_unloading_speed|float %}
        {% set ram_vol     = vars.tip_ramming_volume|float %}
        {% set eject_speed = vars.tip_final_eject_speed|float %}
        {% set skinnydip   = vars.tip_use_skinnydip|lower %}
        {% set skinny_dist = vars.tip_skinnydip_distance|float %}

        M83
        G92 E0

        # --- Step 1: Ramming (optional) ---
        # Kurze Extrusions-Stoesse pressen Filament in die Nozzle
        # und erzeugen einen sauberen Uebergang zur Spitze
        {% if ram_vol > 0 %}
            {% set nozzle_diam = printer.configfile.settings.extruder.nozzle_diameter|default(0.4)|float %}
            {% set fil_diam = printer.configfile.settings.extruder.filament_diameter|default(1.75)|float %}
            {% set fil_area = 3.14159 * (fil_diam/2)**2 %}
            {% set ram_length = ram_vol / fil_area %}
            { action_respond_info("TIP-FORM: Ramming %.1fmm (%.0fmm³)" % (ram_length, ram_vol)) }
            # 3 schnelle Ramming-Stoesse mit steigender Geschwindigkeit
            G1 E{ "%.2f" % (ram_length * 0.30) } F{ 60 * 15 }
            G1 E{ "%.2f" % (ram_length * 0.35) } F{ 60 * 20 }
            G1 E{ "%.2f" % (ram_length * 0.35) } F{ 60 * 25 }
        {% endif %}

        # --- Step 2: Nozzle Separation ---
        # Schnell aus der Schmelzzone rausziehen, dann langsam zur Kuehlzone
        {% set fast_dist = tube_pos * 0.5 %}
        {% set slow_dist = tube_pos - fast_dist %}
        { action_respond_info("TIP-FORM: Nozzle separation — fast %.1fmm + slow %.1fmm" % (fast_dist, slow_dist)) }
        G1 E-{ "%.2f" % fast_dist } F{ 60 * unload_fast|int }
        G1 E-{ "%.2f" % slow_dist } F{ 60 * unload_slow|int }

        # --- Step 3: Cooling Moves ---
        # Hin und her in der Kuehlzone — verfestigt die Spitze und
        # verhindert Blob-Bildung
        { action_respond_info("TIP-FORM: %d cooling moves in %.0fmm zone" % (moves, tube_len)) }
        {% for i in range(moves) %}
            # Speed-Rampe: langsam starten, letzte Moves schnell
            {% set progress = i / (moves - 1) if moves > 1 else 1.0 %}
            {% set speed = cool_slow + (cool_fast - cool_slow) * progress %}
            # Vorwaerts (zurueck Richtung Hotend)
            G1 E{ "%.2f" % tube_len } F{ 60 * speed|int }
            # Rueckwaerts (zurueck in Kuehlzone)
            G1 E-{ "%.2f" % tube_len } F{ 60 * speed|int }
        {% endfor %}

        # --- Step 4 (optional): Skinnydip ---
        # Kurz zurueck in die Schmelzzone um feine Haare abzubrennen
        {% if skinnydip == 'true' %}
            { action_respond_info("TIP-FORM: Skinnydip %.1fmm" % skinny_dist) }
            G1 E{ "%.2f" % skinny_dist } F{ 60 * 30 }
            G4 P50
            G1 E-{ "%.2f" % skinny_dist } F{ 60 * 70 }
        {% endif %}

        # --- Step 5: Final Retract ---
        # Schnell rausziehen um den letzten String zu brechen
        { action_respond_info("TIP-FORM: Final park + string break") }
        G1 E-{ "%.2f" % (tube_len + 5) } F{ 60 * cool_fast|int }

        G92 E0
        { action_respond_info("TIP-FORM: Done") }
    {% endif %}


