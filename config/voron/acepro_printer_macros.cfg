# ============================================================================
# Generic Pause/Resume Macros — Voron 2.4 R2 350mm
# ============================================================================
# Basierend auf ducati1198's Generic Config, angepasst fuer Voron 2.4
# Original: https://github.com/ducati1198/acepro-any-klipper
# ============================================================================

[gcode_macro _PAUSE_RESUME_STATE]
variable_pause_nozzle_timeout_triggered: 0
variable_pre_pause_temp: 0
gcode:
  # no gcode — just holds variables

######################################################################
# Dialog Helper Macros
######################################################################

[gcode_macro INSERT_EXTRUDE_50]
description: Extrude additional 50mm after filament insert
gcode:
    M83
    G92 E0
    G1 E50 F300
    G92 E0

[gcode_macro INSERT_RESUME_PRINT]
description: Resume print after filament insert prompt
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    RESUME

[gcode_macro INSERT_CANCEL_PRINT]
description: Cancel print from filament insert prompt
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    CANCEL_PRINT

[gcode_macro INSERT_LOAD_FILAMENT]
description: Load filament from idle insert prompt
gcode:
  RESPOND TYPE=command MSG=action:prompt_end
  LOAD_FILAMENT

[gcode_macro INSERT_DISMISS]
description: Dismiss filament insert dialog
gcode:
  RESPOND TYPE=command MSG=action:prompt_end

[gcode_macro RUNOUT_DISMISS]
description: Close runout dialog
gcode:
    RESPOND TYPE=command MSG=action:prompt_end

[gcode_macro RUNOUT_CANCEL_PRINT]
description: Cancel print from runout dialog
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    CANCEL_PRINT

######################################################################
# Enhanced Pause/Resume
######################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_nozzle_timeout_seconds: 600
variable_standby_nozzle_temp: 150
gcode:
  {% set vars = printer["gcode_macro _ACE_VARS"] %}
  {% set z = params.Z|default(10)|int %}
  {% set cut_filament = params.CUT_FILAMENT|default(0)|int %}
  {% set standby = params.STANDBY|default(0)|int %}

  {% if printer['pause_resume'].is_paused|int == 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}

    {% set current_target = printer.extruder.target|int %}
    {% if current_target > 0 %}
      SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pre_pause_temp VALUE={current_target}
      {action_respond_info("ACE[M]: PAUSE: Saved pre-pause temp: %d°C" % current_target)}
    {% endif %}

    BASE_PAUSE

    SAVE_GCODE_STATE NAME=PAUSE_LOCAL
      G90
      M82
      VEL_PUSH
      SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500 VELOCITY=200 SQUARE_CORNER_VELOCITY=5

      # --- Extruder retraction before movement ---
      {% set retract_len = vars.pause_extruder_retract|float %}
      {% set retract_speed = vars.pause_extruder_retract_speed|float %}
      {% if retract_len > 0 %}
          { action_respond_info("PAUSE: Retracting %.1fmm filament" % retract_len) }
          M83
          G1 E-{retract_len} F{retract_speed * 60}
          M82
          G92 E0
      {% endif %}

      {% if cut_filament == 1 %}
        {action_respond_info("ACE[M]: PAUSE: Cutting filament")}
        CUT_TIP
      {% endif %}

      G91
      G1 Z3 F1500
      G90

      TO_THROW_POSITION

      VEL_POP
      RESTORE_GCODE_STATE NAME=PAUSE_LOCAL MOVE=0

    {% if standby == 1 and printer['extruder'].target|int > 0 %}
      {% set target = printer['extruder'].target|int %}
      {% set standby_temp = (target - 20) if (target - 20) > 0 else 0 %}
      M104 S{standby_temp}
      {action_respond_info("ACE[M]: PAUSE: Standby mode - nozzle at %s°C" % standby_temp)}
    {% else %}
      {% set timeout = printer["gcode_macro PAUSE"].nozzle_timeout_seconds|int %}
      {action_respond_info("ACE[M]: PAUSE: Nozzle will auto-cool after %s seconds" % timeout)}
      UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION={timeout}
    {% endif %}

    SET_IDLE_TIMEOUT TIMEOUT=43200
    SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pause_nozzle_timeout_triggered VALUE=0

    STATUS_BUSY
    M117 Pausiert

  {% endif %}


[delayed_gcode PAUSE_NOZZLE_TIMEOUT]
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}
        {% set standby_temp = printer["gcode_macro PAUSE"].standby_nozzle_temp|int %}
        { action_respond_info("ACE[M]: Pause timeout reached, lowering to %d°C" % standby_temp) }
        M104 S{standby_temp}
        SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pause_nozzle_timeout_triggered VALUE=1
    {% endif %}


[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    RESPOND TYPE=echo MSG="ACE[M] [RESUME] initiated"
    RESPOND TYPE=command MSG=action:prompt_end
    {% set client_vel = printer.configfile.settings.pause_resume.recover_velocity|default(50.0) %}
    {% set vars = printer["gcode_macro _ACE_VARS"] %}

    {% set default_purge = vars.resume_purge_amount|default(40)|float %}
    {% set purge_amount = params.PURGE|default(default_purge)|float %}
    {% set extra_prime = vars.resume_extra_prime|default(1.0)|float %}
    {% set pre_wipe_retract = vars.resume_post_wipe_retract|default(1.0)|float %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION=0
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        SAVE_GCODE_STATE NAME=RESUME_WRAP

        # --- Reheat nozzle if needed ---
        {% if etemp > 0 %}
            {% set timeout_triggered = printer["gcode_macro _PAUSE_RESUME_STATE"].pause_nozzle_timeout_triggered|int %}
            {% if timeout_triggered == 1 %}
                RESPOND TYPE=echo MSG="ACE[M]: RESUME: Reheating nozzle to {etemp}°C"
            {% endif %}
            M109 S{etemp|int}
        {% endif %}

        # --- ACE tool reactivation (only if filament NOT present) ---
        {% set call_tool_change = false %}
        {% set ace_enabled = printer.configfile.settings.get('output_pin ACE_Pro', None) is not none %}
        {% if ace_enabled %}
            {% set active_tool = printer["gcode_macro _ACE_STATE"].active %}
            {% set filament_detected = false %}
            {% set sensor_exists = printer.configfile.settings.get('filament_switch_sensor filament_toolhead', None) is not none %}
            {% if sensor_exists %}
                {% set filament_detected = printer["filament_switch_sensor filament_toolhead"].filament_detected %}
            {% endif %}
            {% if active_tool >= 0 and not filament_detected %}
                {% set call_tool_change = true %}
                RESPOND TYPE=echo MSG="ACE[M]: Will reload ACE tool T{active_tool} (no filament detected)"
            {% elif active_tool >= 0 and filament_detected %}
                RESPOND TYPE=echo MSG="ACE[M]: SKIPPING ACE reload - filament already present"
                UPDATE_DELAYED_GCODE ID=SYNC_ACE_AFTER_MANUAL_LOAD DURATION=1
            {% endif %}
        {% endif %}

        # --- ACE tool reload if filament was missing ---
        {% if call_tool_change %}
            RESPOND TYPE=echo MSG="ACE[M]: Reloading ACE tool T{active_tool}"
            T{active_tool}
            M400
        {% endif %}

        G92 E0

        # --- Macro's own purge/wipe (skip if ACE toolchange already purged) ---
        {% if purge_amount > 0 and not call_tool_change %}
            TO_THROW_POSITION

            {% if pre_wipe_retract > 0 %}
                RESPOND TYPE=echo MSG="ACE[M]: Retracting {pre_wipe_retract}mm before wipe"
                G91
                G1 E-{pre_wipe_retract} F600
                G90
            {% endif %}

            {% set was_abs_e = printer.gcode_move.absolute_extrude %}
            M83
            G1 E{purge_amount} F300
            {% if was_abs_e %} M82 {% endif %}

            SAVE_GCODE_STATE NAME=RESUME_LOCAL
            VEL_PUSH
            SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500 VELOCITY=200 SQUARE_CORNER_VELOCITY=5
            NOZZLE_CLEAN

            VEL_POP
            RESTORE_GCODE_STATE NAME=RESUME_LOCAL MOVE=0
        {% else %}
            RESPOND TYPE=echo MSG="ACE[M]: No purge/wipe needed"
        {% endif %}

        # --- Extra prime before resuming ---
        {% if extra_prime > 0 %}
            RESPOND TYPE=echo MSG="ACE[M]: Extra prime {extra_prime}mm"
            G91
            G1 E{extra_prime} F300
            G90
            G92 E0
        {% endif %}

        G92 E0
        RESTORE_GCODE_STATE NAME=RESUME_WRAP MOVE=0
        STATUS_PRINTING
        M117 Fortsetzen...
        BASE_RESUME VELOCITY={params.VELOCITY|default(client_vel)}
    {% else %}
        RESPOND TYPE=echo MSG="ACE[M] [RESUME] called, but not paused"
    {% endif %}

[delayed_gcode SYNC_ACE_AFTER_MANUAL_LOAD]
initial_duration: 0
gcode:
    {% set ace_enabled = printer.configfile.settings.get('output_pin ACE_Pro', None) is not none %}
    {% if ace_enabled %}
        {% set active_tool = printer["gcode_macro _ACE_STATE"].active %}
        {% if active_tool >= 0 %}
            RESPOND TYPE=echo MSG="ACE: Syncing state after manual load"
            ACE_DEBUG_SET_FILAMENT_STATE STATE=nozzle
            ACE_DEBUG_SET_CURRENT_INDEX TOOL={active_tool}
        {% endif %}
    {% endif %}

######################################################################
# Velocity Stack
######################################################################

[gcode_macro VEL_PUSH]
variable_stack: []
gcode:
  {% set cur = printer["gcode_macro VEL_PUSH"].stack %}
  {% set s = cur + [(printer.toolhead.max_accel,
                     (printer.toolhead.max_accel_to_decel|default(printer.toolhead.max_accel, true)),
                     printer.toolhead.max_velocity,
                     printer.toolhead.square_corner_velocity)] %}
  SET_GCODE_VARIABLE MACRO=VEL_PUSH VARIABLE=stack VALUE="{s|tojson}"

[gcode_macro VEL_POP]
gcode:
  {% set cur = printer["gcode_macro VEL_PUSH"].stack %}
  {% if cur|length == 0 %}
    {action_respond_info("VEL_POP: stack empty, nothing to restore")}
  {% else %}
    {% set a, atd, v, scv = cur[-1] %}
    SET_VELOCITY_LIMIT ACCEL={a} ACCEL_TO_DECEL={atd} VELOCITY={v} SQUARE_CORNER_VELOCITY={scv}
    {% set s = cur[:-1] %}
    SET_GCODE_VARIABLE MACRO=VEL_PUSH VARIABLE=stack VALUE="{s|tojson}"
  {% endif %}

######################################################################
# Purge Logic
######################################################################

[gcode_macro PURGE_IN_CHUNKS]
description: Splits long purges into chunks with poop clearing
gcode:
  {% set purge = params.PURGELENGTH|default(100)|float %}
  {% set speed = params.PURGESPEED|default(300)|float %}
  {% set already_purged = params.ALREADY_PURGED|default(0)|float %}
  {% set max_chunk = params.PURGE_MAX_CHUNK_LENGTH|default(300)|float %}

  {% set total_purge = purge + already_purged %}
  {% set full_chunks = (total_purge / max_chunk)|int %}
  {% set first_chunk_done = already_purged % max_chunk %}
  {% set first_chunk_remaining = max_chunk - first_chunk_done %}

  {% if purge <= 0 %}
    {action_respond_info("ACE: No purge needed")}
  {% elif full_chunks == 0 %}
    {action_respond_info("ACE: Purging single chunk: %.1fmm (%.1fmm already done)" % (purge, already_purged))}
    PURGE_AND_POOP PURGELENGTH={purge} PURGESPEED={speed}
  {% else %}
    {% set remaining_to_purge = purge %}
    {% if first_chunk_done > 0 and first_chunk_remaining <= remaining_to_purge %}
      {action_respond_info("ACE: Completing chunk: %.1fmm (%.1fmm already done)" % (first_chunk_remaining, first_chunk_done))}
      PURGE_AND_POOP PURGELENGTH={first_chunk_remaining} PURGESPEED={speed}
      {% set remaining_to_purge = remaining_to_purge - first_chunk_remaining %}
      {% set chunk_offset = 1 %}
    {% else %}
      {% set chunk_offset = 0 %}
    {% endif %}

    {% set remaining_full_chunks = (remaining_to_purge / max_chunk)|int %}
    {% for i in range(remaining_full_chunks) %}
      {action_respond_info("ACE: Purging chunk %d/%d: %.1fmm" % (i + 1 + chunk_offset, remaining_full_chunks + chunk_offset, max_chunk))}
      PURGE_AND_POOP PURGELENGTH={max_chunk} PURGESPEED={speed}
    {% endfor %}

    {% set final_remainder = remaining_to_purge - (remaining_full_chunks * max_chunk) %}
    {% if final_remainder > 0 %}
      {action_respond_info("ACE: Purging final chunk: %.1fmm" % final_remainder)}
      PURGE_AND_POOP PURGELENGTH={final_remainder} PURGESPEED={speed}
    {% endif %}
  {% endif %}

[gcode_macro PURGE_AND_POOP]
description: Single purge operation
gcode:
  {% set purge = params.PURGELENGTH|float %}
  {% set speed = params.PURGESPEED|float %}
  M83
  G92 E0
  G1 E{purge*0.90} F{speed}
  G1 E{purge*0.10} F{speed*1.25}
  G1 E-1 F{speed*1.25}
  G92 E0
  G1 E1 F{speed*1.25}

######################################################################
# Filament Load / Unload
######################################################################

[gcode_macro LOAD_FILAMENT]
description: Load filament manually
gcode:
  SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
  {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
  {% endif %}
  TO_THROW_POSITION

  {% set min_ext = printer.configfile.settings.extruder.min_extrude_temp|default(210)|int %}
  {% set cur_temp = printer.extruder.temperature|float %}
  {% if cur_temp < min_ext %}
    {action_respond_info("ACE: Heating nozzle to 245°C for load (current=%.1f°C)" % cur_temp)}
    M109 S245
  {% endif %}

  M83
  G92 E0
  M400
  {action_respond_info("ACE: Extruding 150mm...")}
  G1 E150 F300
  G92 E0

  RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE MOVE=0

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament with cutter and retract
gcode:
  SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
  {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
  {% endif %}

  CUT_TIP
  M400
  {action_respond_info("ACE: Retracting 100mm of filament...")}
  M302 P1
  G91
  G1 E-100 F600
  G90
  M302 P0
  RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE MOVE=0

