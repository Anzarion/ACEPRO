# ============================================================================
# ACE Pro Generic Macros — Voron 2.4 R2 350mm
# ============================================================================
# Basierend auf ducati1198's Generic Config, angepasst fuer Voron 2.4
# Original: https://github.com/ducati1198/acepro-any-klipper
# ============================================================================
# Externe Macros erwartet (definiert in acepro.cfg):
# - CUT_TIP
# - TO_THROW_POSITION
# - NOZZLE_CLEAN
# - _PAUSE_RESUME_STATE (definiert in acepro_printer_macros.cfg)

# ============================================================================
# CUSTOM VARIABLES FOR PRINTER-SPECIFIC MOVEMENTS
# ============================================================================
# Alle druckerspezifischen Koordinaten an EINER Stelle.
# Passe diese Werte an deinen Voron 2.4 350mm an!

[gcode_macro _ACE_VARS]
# --- Cutting variables ---
# FilamATrix Cutter — Depressor links hinten, Schnitt auf X-Achse
variable_cut_enabled: True
variable_cut_block_x: 22
variable_cut_block_y: 359
variable_cut_engage_x: 20
variable_cut_engage_y: 359
variable_cut_full_x: 4.4
variable_cut_full_y: 359
variable_cut_speed: 1000             # Speed of cutting motion (mm/min)
variable_cut_retract_distance: 45    # Distance to retract after cutting (mm)
variable_cut_repetitions: 1          # Number of cutting cycles
variable_cut_pause_ms: 0             # Pause at full cut position (0 = no pause)
variable_cut_axis: 'X'               # Axis for cutting motion ('X' or 'Y')

# --- Pooping variables ---
# Bucket rechts neben der Silikonbuerste (Printables 796563)
variable_poop_x: 35
variable_poop_y: 359
variable_poop_x_speed: 9000          # Speed for X movement to poop area (mm/min)
variable_poop_y_speed: 9000          # Speed for Y movement into poop position (mm/min)

# --- Wiping ---
# Nozzle Wipe nutzt NOZZLE_CLEAN aus macros.cfg (Silikonbuerste, Printables 796563)
variable_wipe_enable: True

# --- Pause extruder retraction ---
variable_pause_extruder_retract: 1.0
variable_pause_extruder_retract_speed: 35.0

# --- Resume purge and post-wipe ---
variable_resume_purge_amount: 40.0
variable_resume_extra_prime: 0.5
variable_resume_post_wipe_retract: 0.5

# --- Unload tool retraction ---
variable_unload_tool_retract: 5.0
variable_unload_tool_retract_speed: 20.0

# --- Purge line (underline) variables ---
# --- Tip-Forming (Fallback wenn kein Cutter installiert) ---
# Basierend auf Happy Hare / SuperSlicer Tip-Forming-Logik
# Werte fuer Stealthburner + Dragon HF
variable_tip_cooling_tube_pos: 30     # mm ab Nozzle-Innenseite bis Anfang Kuehlzone (DragonHF:30, DragonST:35, RapidoHF:27)
variable_tip_cooling_tube_len: 10     # Laenge der Kuehlzone in mm (DragonHF:10, DragonST:15, RapidoHF:10)
variable_tip_cooling_moves: 4         # Anzahl Hin-und-Her Kuehldurchlaeufe (2-4 = guter Start)
variable_tip_cooling_speed_start: 10  # Langsam zum Verfestigen (mm/s)
variable_tip_cooling_speed_final: 50  # Schnell zum Abreissen des Strings (mm/s) — Happy Hare Default
variable_tip_unloading_speed_start: 80 # Initiale Trennung von Schmelzzone (mm/s) — Happy Hare Default
variable_tip_unloading_speed: 18       # Langsam durch Kuehlzone (mm/s) — Happy Hare Default
variable_tip_ramming_volume: 0         # Ramming deaktiviert — Slicer-Ramming bevorzugt (Happy Hare Default)
variable_tip_final_eject_speed: 25     # Speed fuer finalen Park-Move (mm/s)
variable_tip_use_skinnydip: True       # Nochmal kurz in Schmelzzone tauchen um Faden+Kugel abzubrennen
variable_tip_skinnydip_distance: 20    # mm von Parkpos (-30mm) → Ziel -10mm = mitten in Schmelzzone (≙ Happy Hare 30mm)

# --- Idle heater control ---
variable_idle_heater_off: True

# --- Default nozzle temperature ---
variable_default_nozzle_temp: 200

gcode:
    # This macro only holds variables; it does nothing when called

###############################################################################################################################

######################################################################
# ACE State Management
######################################################################

[gcode_macro _ACE_STATE]
variable_orig_target: 0
variable_bumped: 0
variable_startup_toolchange: 0
variable_active: -1
variable_heating_temperature: 0
variable_prev_tool_heating_temperature: 0
variable_pre_toolchange_fan: 0
gcode:
    # no gcode — just holds variables

######################################################################
# ACE Preparation Macros
######################################################################

[gcode_macro _ACE_PREPARE_FOR_RETRACTION]
description: Handle heating and CUT_TIP for retraction
gcode:
  {% set target_temp      = params.TARGET_TEMP|default(0)|int %}
  {% set pre_cut_retract  = params.PRE_CUT_RETRACT|default(2)|float %}
  {% set current_temp     = printer.extruder.temperature|float %}
  {% set current_target   = printer.extruder.target|int %}
  {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp|default(200)|int %}

  {% if current_temp < min_extrude_temp or current_target < min_extrude_temp %}
    {% set heat_temp = target_temp if target_temp >= min_extrude_temp else (min_extrude_temp + 10) %}
    { action_respond_info("ACE: PREPARE_RETRACT - heating to %d°C" % heat_temp) }
    M109 S{heat_temp}
  {% else %}
    { action_respond_info("ACE: PREPARE_RETRACT - already hot enough (%.1f°C)" % current_temp) }
  {% endif %}

  {% if pre_cut_retract > 0 %}
    { action_respond_info("ACE: PREPARE_RETRACT - pre-cut retract %.1fmm" % pre_cut_retract) }
    M83
    G1 E-{pre_cut_retract} F600
    G92 E0
  {% endif %}

  {% if printer["gcode_macro CUT_TIP"] is defined %}
    { action_respond_info("ACE: PREPARE_RETRACT - cutting tip") }
    CUT_TIP
  {% else %}
    { action_respond_info("ACE: CUT_TIP macro not available") }
  {% endif %}

######################################################################
# Pre/Post Toolchange
######################################################################

[gcode_macro _ACE_PRE_TOOLCHANGE]
description: Pre-toolchange prep with smart temperature management
variable_min_zhop: 4
variable_allow_unhomed_zhop: 0
gcode:
  {% if printer["output_pin ACE_Pro"].value %}
    { action_respond_info("ACE[M]: Pre toolchange") }

    # --- Temperatures ---
    {% set current_target   = printer.extruder.target|int %}
    {% set current_temp     = printer.extruder.temperature|float %}
    {% set min_extrude      = printer.configfile.settings.extruder.min_extrude_temp|default(170)|int %}
    {% set inventory_temp   = params.TARGET_TEMP|default(0)|int %}
    {% set is_paused        = printer.pause_resume.is_paused|int %}

    {% set pre_pause_temp = 0 %}
    {% if is_paused and printer["gcode_macro _PAUSE_RESUME_STATE"] is defined %}
      {% set pre_pause_temp = printer["gcode_macro _PAUSE_RESUME_STATE"].pre_pause_temp|default(0)|int %}
      {% if pre_pause_temp > 0 %}
        { action_respond_info("ACE[M]: PRE - paused state, using saved pre-pause temp %d°C" % pre_pause_temp) }
      {% endif %}
    {% endif %}

    # Determine if we are printing or paused
    {% set print_state = printer.print_stats.state|lower %}
    {% set is_printing = (print_state == 'printing') %}
    {% set is_paused_state = (print_state == 'paused') %}

    # Get idle heater control variable
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set idle_heater_off = vars.idle_heater_off | lower == 'true' %}

    # Remember original target for POST
    {% if is_printing or is_paused_state %}
        {% set orig_temp = pre_pause_temp if pre_pause_temp > 0 else current_target %}
    {% else %}
        {% if idle_heater_off %}
            {% set orig_temp = 0 %}
        {% else %}
            {% set orig_temp = pre_pause_temp if pre_pause_temp > 0 else current_target %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=orig_target VALUE={orig_temp}

    # --- Safe Z-hop before moves ---
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    {% set margin = 0.2 %}
    {% set curz = printer.toolhead.position.z|float %}

    SAVE_GCODE_STATE NAME=purge_state
    {% if curz < 4.0 %}
      {% set target_z = 4.0 if 4.0 < (zmax - margin) else (zmax - margin) %}
      { action_respond_info("ACE[M]: Z-hop: curz < 4mm, moving to %.3f" % target_z) }
      G90
      G1 Z{ target_z|round(3) } F1500
    {% else %}
      {% set lift_z = curz + 2.0 %}
      {% set target_z = lift_z if lift_z < (zmax - margin) else (zmax - margin) %}
      { action_respond_info("ACE[M]: Z-hop: lifting by 2mm to %.3f" % target_z) }
      G90
      G1 Z{ target_z|round(3) } F1500
    {% endif %}

    # Save current fan speed and disable part cooling
    {% set current_fan = printer.fan.speed|default(0.0)|float %}
    {% set current_fan_pwm = (current_fan * 255)|int %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pre_toolchange_fan VALUE={current_fan_pwm}
    { action_respond_info("ACE[M]: PRE - saving fan speed (%d PWM) and disabling" % current_fan_pwm) }
    M106 S0

    # Move to throw position
    TO_THROW_POSITION

    # Decide target temp: pre_pause > slicer > inventory > fallback
    {% if pre_pause_temp > 0 %}
      { action_respond_info("ACE[M]: PRE - using pre-pause temp %d°C" % pre_pause_temp) }
      {% set target_temp = pre_pause_temp %}
    {% elif current_target > 0 %}
      { action_respond_info("ACE[M]: PRE - using slicer temp %d°C (printing)" % current_target) }
      {% set target_temp = current_target %}
    {% elif inventory_temp >= min_extrude %}
      { action_respond_info("ACE[M]: PRE - using inventory temp %d°C (manual)" % inventory_temp) }
      {% set target_temp = inventory_temp %}
      M104 S{target_temp}
    {% else %}
      {% set target_temp = vars.default_nozzle_temp|int %}
      { action_respond_info("ACE[M]: PRE - using fallback temp %d°C" % target_temp) }
      M104 S{target_temp}
    {% endif %}

    # Heat if needed
    {% if current_temp < target_temp-10 %}
      { action_respond_info("ACE[M]: PRE - heating to %d°C..." % target_temp) }
      M109 S{target_temp}
    {% else %}
      { action_respond_info("ACE[M]: PRE - already at %.1f°C" % current_temp) }
    {% endif %}

  {% else %}
    { action_respond_info("ACE[M]: WARNING: ACE disabled!") }
  {% endif %}


[gcode_macro _ACE_POST_TOOLCHANGE]
description: Post-toolchange with purge and temperature restoration
gcode:
  {% set purge = params.PURGELENGTH|default(50)|float %}
  {% set speed = params.PURGESPEED|default(200)|float %}
  {% set already_purged = params.PURGED_AMOUNT|default(0)|float %}
  {% set purge_max_chunk_length = params.PURGE_MAX_CHUNK_LENGTH|default(300)|float %}

  {% if printer["output_pin ACE_Pro"].value %}
    {action_respond_info("ACE[M]: Post toolchange")}

    # --- Temperature decisions ---
    {% set st             = printer["gcode_macro _ACE_STATE"] %}
    {% set orig_temp      = st.orig_target|int %}
    {% set current_temp   = printer.extruder.temperature|float %}
    {% set inventory_temp = params.TARGET_TEMP|default(0)|int %}

    {% if orig_temp > 0 %}
      {% set purge_temp = orig_temp %}
    {% elif inventory_temp > 0 %}
      {% set purge_temp = inventory_temp %}
    {% else %}
      {% set purge_temp = 190 %}
    {% endif %}

    {% if current_temp < purge_temp-10.0 %}
      { action_respond_info("ACE[M]: POST - heating to %d°C for purge" % purge_temp) }
      M109 S{purge_temp}
    {% endif %}

    {% if already_purged > 0 %}
      { action_respond_info("ACE[M]: Already purged %.1fmm, purging additional %dmm at %dmm/min (%.1f°C)" % (already_purged, purge|int, speed|int, current_temp)) }
    {% else %}
      { action_respond_info("ACE[M]: Purging %dmm at %dmm/min (%.1f°C)" % (purge|int, speed|int, current_temp)) }
    {% endif %}

    # Get saved fan speed
    {% set saved_fan_pwm = st.pre_toolchange_fan|default(0)|int %}
    {% if saved_fan_pwm == 0 %}
      {% set current_fan = printer.fan.speed|default(0.0)|float %}
      {% set saved_fan_pwm = (current_fan * 255)|int %}
    {% endif %}

    {% set vars = printer["gcode_macro _ACE_VARS"] %}

    # Already at poop position from PRE (TO_THROW_POSITION)
    G90

    # --- Purge filament ---
    {% if purge > 0 %}
      M83
      G92 E0
      M106 S0
      PURGE_IN_CHUNKS PURGELENGTH={purge} PURGESPEED={speed} ALREADY_PURGED={already_purged} PURGE_MAX_CHUNK_LENGTH={purge_max_chunk_length}
    {% endif %}

    # --- Wipe nozzle (if enabled, skip during startup) ---
    {% if vars.wipe_enable | lower == 'true' and not st.startup_toolchange %}
        NOZZLE_CLEAN
    {% elif st.startup_toolchange %}
        { action_respond_info("ACE[M]: POST - skipping wipe (startup toolchange)") }
    {% endif %}

    # Restore fan speed
    { action_respond_info("ACE[M]: POST - restoring fan speed to %d PWM" % saved_fan_pwm) }
    M106 S{saved_fan_pwm}

    # --- Restore temperature ---
    {% if orig_temp == 0 %}
      { action_respond_info("ACE[M]: POST - turning off heater (was manual toolchange)") }
      M104 S0
    {% else %}
      { action_respond_info("ACE[M]: POST - restoring temp to %d°C" % orig_temp) }
      M104 S{orig_temp}
    {% endif %}

    M400

    RESTORE_GCODE_STATE NAME=purge_state MOVE=1 MOVE_SPEED=200
    G92 E0

  {% else %}
    {action_respond_info("ACE[M]: WARNING: ACE disabled!")}
  {% endif %}

######################################################################
# Utility Shortcuts
######################################################################

[gcode_macro _UNLOAD_TOOL_PRINT]
description: Retract filament and unload tool via ACE
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set retract_length = params.RETRACT|default(vars.unload_tool_retract)|float %}
    {% set retract_speed_mms = params.SPEED|default(vars.unload_tool_retract_speed)|float %}
    {% set retract_speed_mmmin = retract_speed_mms * 60 %}

    {% set current_temp = printer.extruder.temperature|float %}
    {% if current_temp < 170 %}
        RESPOND MSG="UNLOAD_TOOL: Nozzle at {current_temp}°C - heating to 210°C"
        M109 S210
    {% else %}
        RESPOND MSG="UNLOAD_TOOL: Nozzle at {current_temp}°C - safe to retract"
    {% endif %}

    RESPOND MSG="UNLOAD_TOOL: Retracting {retract_length}mm at {retract_speed_mms}mm/s"
    M83
    G1 E-{retract_length} F{retract_speed_mmmin}
    M82
    G92 E0

    ACE_CHANGE_TOOL TOOL=-1
    M400


