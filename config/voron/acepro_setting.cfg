# ============================================================================
# ACE Pro Configuration Settings — Voron 2.4 R2 350mm
# ============================================================================
# Basierend auf ducati1198's Generic Config, angepasst fuer Voron 2.4
# Original: https://github.com/ducati1198/acepro-any-klipper
# ============================================================================
# HINWEIS: [save_variables] ist in sensorless_homing.cfg definiert
# HINWEIS: [respond] ist in fluidd.cfg definiert
# ============================================================================

[include acepro_macros.cfg]

######################################################################
# Custom Tool Macros (Optional - For Spoolman/Extensions)
######################################################################
# ACE automatically detects custom T<n> macros and skips auto-registration.
# Use this for integrations like Spoolman: https://github.com/Donkie/Spoolman
#
# Example: Custom T0 macro with Spoolman integration
# [gcode_macro T0]
# gcode:
#     SET_ACTIVE_SPOOL ID=1
#     ACE_CHANGE_TOOL TOOL=0
######################################################################

# Workaround to get an on/off switch to toggle between ACE Pro and external spool printing
[virtual_pins]

[output_pin ACE_Pro]
pin: virtual_pin:ace_pro
pwm: False
value: 1
shutdown_value: 0

[output_pin AUTO_UNLOAD]
pin: virtual_pin:auto_unload
pwm: False
value: 1
shutdown_value: 0

[output_pin _TANGLE_DETECTION]
pin: virtual_pin:tangle_detection
pwm: False
value: 1
shutdown_value: 0

[output_pin bed_mesh_adaptive]
pin: virtual_pin:bed_mesh_adaptive_pin
value: 1          # 1 = adaptive enabled (default), 0 = full mesh

######################################################################
# ACE Treiber-Konfiguration
######################################################################

[ace]
ace_count: 1
baud: auto            # auto = 115200 for ACE1, 230400 for ACE2
protocol: auto        # auto = detect from connected USB devices

# Sensor-Mapping: Voron-Sensoren -> ACE-Treiber
# "filament_toolhead"   = Briconaut am Toolhead-Eingang, VOR Extruder (EBBCan) -> Stufe Toolhead
# "filament_nozzle"     = Sensor NACH Extruder-Gears (EBBCan)                  -> Stufe Nozzle
# "filament_runout_rdm" = Anycubic RDM am Rahmen (Manta M8P)                   -> Stufe RDM
filament_runout_sensor_name_toolhead: filament_toolhead
filament_runout_sensor_name_nozzle: filament_nozzle
filament_runout_sensor_name_rdm: filament_runout_rdm

# Default state of feed-assist after ACE connect/re-connect
feed_assist_active_after_ace_connect: True

# Connection supervision: monitors ACE connection stability
ace_connection_supervision: True

# Tangle detection (pump_time mode — reads ACE cont_assist_time directly)
tangle_detection: True
status_debug_logging: True
ace_debug: True
tangle_pump_time: 5.0

# RFID temperature mode: how to calculate print temp from RFID tag min/max values
# Options: average (default), min, max
#rfid_temp_mode: average

# === Geschwindigkeiten ===
feed_speed: 60
retract_speed: 50

# === Tube-Laengen (GEMESSEN fuer Voron 2.4 350mm) ===

# Sicherheitslimit: Fehler wenn mehr als diese Laenge gefuettert wird
total_max_feeding_length: 3000

# ACE Parkposition -> Toolhead-Sensor (Briconaut)
# GEMESSEN: 20x50 (Park->RDM) + 22x50 (RDM->Toolhead) = 2100mm
parkposition_to_toolhead_length: 2100

# ACE Parkposition -> RDM-Sensor (Anycubic RDM am Rahmen)
# GEMESSEN: 20x50 = 1000mm
parkposition_to_rdm_length: 1000

# Kein zusaetzlicher Purge nach dem Laden — Slicer Purge Tower uebernimmt
toolhead_full_purge_length: 0

# Langsames Laden am Toolhead
toolhead_slow_loading_speed: 5
# Toolhead Retraction: Filament muss vom Cut Point zurueck ueber
# Gears und am Sensor vorbei. Siehe Toolhead-Geometrie bei
# extruder_feeding_length: 35mm nach der gemessenen Rechnung, 40mm nach der
# aelteren - 50mm deckt beides sicher ab.
toolhead_retraction_speed: 15
toolhead_retraction_length: 50

# Feed-Laenge ab ACE (Tube-Laenge + Puffer)
toolchange_load_length: 2400

# Timeout multiplier for longer tubes
timeout_multiplier: 3

# Max dryer temperature
max_dryer_temperature: 65

# Extruder-Feeding nachdem Toolhead-Sensor getriggert hat
#
# TOOLHEAD-GEOMETRIE (eine Quelle, hier gepflegt):
#   Sensor -> Gears      15mm   GEMESSEN
#   Gears  -> Cut Point  20mm   GEMESSEN
#   Sensor -> Cut Point  35mm   = 15 + 20
#
# ACHTUNG, unaufgeloester Widerspruch (2026-09-18 bemerkt):
#   - Der Kommentar bei toolhead_retraction_length rechnet mit 25mm
#     Gears->Cut Point, also 40mm gesamt. Hier stehen 20mm als GEMESSEN.
#   - Die Zeile "25mm = von Gears genau bis zum Cut Point" passt zu keiner
#     der beiden Lesarten: gemessen wird ab dem SENSOR, nicht ab den Gears,
#     und 25mm ab Sensor endet 10mm hinter den Gears - vor dem Cut Point.
#   Beide Rechnungen sind unkritisch, weil toolhead_retraction_length: 50
#   sowohl 35mm als auch 40mm sicher abdeckt. Beim naechsten Ausbau des
#   Toolheads einmal nachmessen und diesen Block zur einzigen Quelle machen.
extruder_feeding_length: 25
extruder_feeding_speed: 5

# === Purge-Konfiguration ===
# Kein zusaetzlicher Purge im Bucket — Slicer Purge Tower uebernimmt
default_color_change_purge_length: 0
default_color_change_purge_speed: 300
purge_max_chunk_length: 250
purge_multiplier: 1.0

# Retry: How much filament to feed incrementally if initial loading failed
incremental_feeding_length: 100
incremental_feeding_speed: 60

# Retract vor CUT_TIP
pre_cut_retract_length: 2

# RDM Overshoot: Extra Rueckzug NACH dem RDM-Sensor, damit Filament-Spitze
# den Splitter-Ausgang passiert. Muss groesser sein wenn Splitter weiter vom
# RDM-Sensor entfernt ist. Nicht verwechseln mit parkposition_to_rdm_length!
rdm_overshoot_length: 50

# Flush Overshoot: Extra Vorschub NACH dem Freiwerden des Toolhead-Sensors
# beim Flush Forward einer leergelaufenen Spule. Der Sensor sitzt VOR dem
# Extruder, der Rest der alten Rolle steckt beim Freimelden also noch in den
# Foerderraedern - die greifen dann weiter den Stummel und das neu geladene
# Filament stoesst nur gegen dessen Ende. 0 schaltet es ab.
#
# 20mm, weil Sensor->Gears gemessen 15mm betraegt (siehe Toolhead-Geometrie
# oben): 5mm Reserve hinter den Raedern. Bis zum Cut Point waeren es 35mm,
# das ist hier nicht noetig - der Stummel muss nur aus dem Griff der Raeder.
flush_overshoot_length: 20

# Flush-Geschwindigkeit in mm/s Filament. 6.0 bei 1.75mm sind 14.4 mm3/s -
# fuer den Dragon HF unkritisch, zumal ins Freie extrudiert wird. Die Grenze
# ist der Extruder-Grip ueber 2.1m Bowden, nicht die Schmelzleistung.
flush_forward_speed: 6

# Runout sensor debounce: number of consecutive sensor-absent readings
# before confirming a filament runout. At 50ms poll: 1=immediate, 3~150ms, 5~250ms
runout_debounce_count: 3

# === Moonraker Lane Sync (OrcaSlicer Filament-Erkennung) ===
moonraker_lane_sync_enabled: True
moonraker_lane_sync_url: http://127.0.0.1:7125
moonraker_lane_sync_namespace: lane_data
# moonraker_lane_sync_api_key:
moonraker_lane_sync_timeout: 2.0
moonraker_lane_sync_unknown_material_mode: empty   # passthrough|empty|map
moonraker_lane_sync_unknown_material_markers: ???,unknown,n/a,none
moonraker_lane_sync_unknown_material_map_to: PLA    # used when mode=map

######################################################################
# ACE Temperatur-Sensor
######################################################################

[temperature_ace]

[temperature_sensor _acepro_temp]
sensor_type: temperature_ace
ace_instance: 0
min_temp: 0
max_temp: 70
